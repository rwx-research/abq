name: Bigtest

on:
  workflow_dispatch:
    inputs:
      version:
        description: ABQ version already published to staging
        required: true
        type: string

permissions:
  contents: read

jobs:
  bigtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install RWX CLI
        run: |
          curl -fsSL https://github.com/rwx-cloud/rwx/releases/download/v3.33.0/rwx-linux-x86_64 -o "$RUNNER_TEMP/rwx"
          chmod +x "$RUNNER_TEMP/rwx"
      - name: Run benchmarks on RWX
        env:
          RWX_ACCESS_TOKEN: ${{ secrets.RWX_ACCESS_TOKEN }}
          ABQ_VERSION: ${{ inputs.version }}
        run: '"$RUNNER_TEMP/rwx" run .rwx/bigtest.yml --init "abq-version=$ABQ_VERSION" --wait'
